name: i18n regression tests

on:
  push:
  pull_request:

jobs:
  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run language tests
        run: python -m unittest discover -s tests -v
